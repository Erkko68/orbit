name: PR title

# Squash merge turns the PR title into the commit on main, so it must follow Conventional Commits.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            build
          subjectPattern: ^[a-z].{0,60}$
          subjectPatternError: 'Subject must start lowercase and stay short (subject line max 72 chars), e.g. "feat(expenses): add balance calculation".'
