name: Project sync

# Keeps the project board and its roadmap in step with the issues: status, dates, the plan and the deviation.
# Every run recomputes the whole board, so the event only says "something changed".
on:
  issues:
    types: [opened, closed, reopened, assigned, unassigned, milestoned, demilestoned, labeled, unlabeled]
  pull_request:
    types: [opened, edited, reopened, closed]
  # Edits on the board itself (Estimate, Size, Priority) and "Blocked by" links trigger nothing: this picks them up.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: project-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Project sync
    # PRs from forks get no secrets, so there is nothing they can sync.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 .github/scripts/project_sync.py
        env:
          # GITHUB_TOKEN cannot write to a user-owned project: a classic PAT with the project scope.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
