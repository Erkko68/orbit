name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No hardcoded styles outside the design system
        run: |
          if grep -rnE '[0-9]\.(dp|sp)\b|Color\(0x' --include='*.kt' shared/src androidApp/src | grep -v '/core/designsystem/'; then
            echo "::error::Use OrbitSpacing and the theme instead of hardcoded dp, sp or colors (AGENTS.md, UI and theme)."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :androidApp:assembleDebug :shared:testAndroidHostTest

  ios:
    name: iOS compile + tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :shared:iosSimulatorArm64Test

  firestore-rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: firebase
      - name: Run rules tests with Firestore emulator
        run: npx --yes firebase-tools emulators:exec --only firestore "npm test"
        working-directory: firebase

