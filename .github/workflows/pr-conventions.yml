name: PR conventions

# Squash merge turns the PR title into the commit on main, so it must follow Conventional Commits.
# Every issue a PR closes must have its real hours in the project's Actual field.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            build
          subjectPattern: ^[a-z].{0,60}$
          subjectPatternError: 'Subject must start lowercase and stay short, e.g. "feat(expenses): add balance calculation".'

  branch:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feature|fix|refactor|docs|test|chore|build)/[0-9]+-[a-z0-9-]+$ ]]; then
            echo "::error::Branch '$BRANCH' must be <type>/<issue>-short-name, e.g. feature/42-balance-calculation"
            exit 1
          fi

  actual:
    name: Actual hours
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # the comment that says how to log the hours
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 .github/scripts/actual_hours.py
        env:
          # GITHUB_TOKEN cannot read a user-owned project: a classic PAT with the project scope.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_TOKEN: ${{ github.token }}
