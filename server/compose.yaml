# The assistant on our own server (ADR 0007): this backend and the Gemma it asks, side by side.
#   docker compose up -d --build
# The model in ASSISTANT_MODEL is pulled on every start (the `model` service) before the assistant starts.
# Put HTTPS in front of the published port (a reverse proxy or a tunnel); the app only talks HTTPS.
services:
  assistant:
    build: .
    restart: unless-stopped
    ports:
      # The host port: 8080 unless ASSISTANT_PORT says otherwise (8080 may be taken on the host).
      - "${ASSISTANT_PORT:-8080}:8080"
    # Keys come from a .env file next to this one, never committed.
    environment:
      # An orbit-app-dev API key allowed to call the Identity Toolkit API: checks the callers' ID tokens.
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:?set FIREBASE_API_KEY in .env}
      # The server's public address (https://…), sent as Referer for a key restricted to that website.
      PUBLIC_URL: ${PUBLIC_URL:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-gemma4:e2b}
      # How long the model thinks before it answers: none (off, the quick default), low, medium or high.
      ASSISTANT_REASONING_EFFORT: ${ASSISTANT_REASONING_EFFORT:-none}
      MODEL_URL: http://ollama:11434/v1
    depends_on:
      model:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    # Not published: only the assistant reaches the model, over the compose network.
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30

  # Pulls ASSISTANT_MODEL into Ollama, then exits. A model already in the volume is only checked, so restarts are quick.
  model:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${ASSISTANT_MODEL:-gemma4:e2b}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama:
