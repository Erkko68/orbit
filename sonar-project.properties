sonar.organization=orbit-app
sonar.projectKey=Erkko68_orbit

sonar.sources=shared/src,androidApp/src,firebase,.github/scripts
sonar.test.inclusions=**/*Test/**,firebase/tests/**
# Kotlin coverage from Kover (:shared:koverXmlReport, run by sonarqube.yml).
sonar.coverage.jacoco.xmlReportPaths=shared/build/reports/kover/report.xml
# Temporary: the Python code has no coverage report yet. See AGENTS.md (Merge rules).
# The Firebase repositories call the live SDK and cannot run in host tests (repositories are faked).
# The Firestore document classes are only the wire format that the SDK writes.
sonar.coverage.exclusions=.github/scripts/**,firebase/**,**/data/repository/FirebaseAuthRepository.kt,**/data/repository/FirestoreSpaceRepository.kt,**/data/mapper/SpaceDocuments.kt
