[versions]
agp = "9.1.1"  # Pinned to 9.1.x: newest AGP supported by IntelliJ IDEA
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
coil = "3.6.3"
composeMultiplatform = "1.12.1"
coroutines = "1.11.0"
kermit = "2.2.0"
koin = "4.2.2"
kotlin = "2.4.20"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.11.0"
ksp = "2.3.12"
ktor = "3.6.0"
# Latest stable CMP material3. Expressive APIs (MotionScheme, MaterialExpressiveTheme) are internal here, alpha-only.
material3 = "1.9.0"
multiplatformSettings = "1.3.0"
navigation = "2.9.2"
# Room over SQLDelight: Room KMP is stable on Android + iOS and is the AndroidX standard.
room = "2.8.5"
sqlite = "2.7.1"

# Planned, not wired yet (see commented entries below)
# camerax = "1.6.2"
# firebase-gitlive = "2.7.0"
# google-services = "4.5.0"
# litertlm = "0.17.1"
# mlkit-genaiPrompt = "1.0.0-beta4"
# mlkit-textRecognition = "16.0.1"
# workmanager = "2.11.2"

[libraries]
# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# Koin
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-test = { module = "io.insert-koin:koin-test" }

# KotlinX
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

# Misc
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
multiplatformSettings = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }

# Testing
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Planned, not wired yet
# litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }                      # Gemma 4 E2B on-device LLM (androidMain)
# mlkit-textRecognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit-textRecognition" }             # Receipt OCR (androidMain)
# mlkit-genaiPrompt = { module = "com.google.mlkit:genai-prompt", version.ref = "mlkit-genaiPrompt" }                        # Gemini Nano fallback, beta only (androidMain)
# firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "firebase-gitlive" }                                 # Group sync auth, KMP wrapper (commonMain)
# firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "firebase-gitlive" }                       # Group sync data, KMP wrapper (commonMain)
# camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }                                    # Receipt / setup photo capture (androidMain)
# camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }                                # (androidMain)
# camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }                                          # Preview view; permission via activity-result API (androidMain)
# workmanager = { module = "androidx.work:work-runtime-ktx", version.ref = "workmanager" }                                     # Background download of the ~2.5 GB model (androidMain)

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
# googleServices = { id = "com.google.gms.google-services", version.ref = "google-services" }  # Firebase config (androidApp)
