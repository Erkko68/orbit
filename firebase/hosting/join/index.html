<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Join on Orbit</title>
  <style>
    :root {
      --page: #f3f4f9;
      --panel: #ffffff;
      --ink: #0e1230;
      --soft: #5e5e64;
      --button: #0e1230;
      --on-button: #f3f4f9;
      --code: #e2e2e9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #131318;
        --panel: #2a292f;
        --ink: #f3f4f9;
        --soft: #c6c6cd;
        --button: #f3f4f9;
        --on-button: #0e1230;
        --code: #35343a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--page);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 24px;
      background: var(--panel);
      display: grid;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 1.6rem; line-height: 1.2; }
    p { margin: 0; color: var(--soft); }
    .code {
      padding: 16px;
      border-radius: 16px;
      background: var(--code);
      text-align: center;
      font: 600 2rem/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      letter-spacing: 0.2em;
      user-select: all;
    }
    .button {
      display: block;
      width: 100%;
      min-height: 56px;
      padding: 16px;
      border: 0;
      border-radius: 16px;
      background: var(--button);
      color: var(--on-button);
      font: inherit;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .button.quiet { background: var(--code); color: var(--ink); }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">You are invited to Orbit</h1>
    <section id="invitation" hidden>
      <p id="intro">Open the invitation in the app, or enter this code under "Got an invite?".</p>
    </section>
    <div id="code" class="code" hidden></div>
    <a id="open" class="button" href="orbit://join/" hidden>Open in Orbit</a>
    <button id="copy" class="button quiet" type="button" hidden>Copy the code</button>
    <p id="get" hidden>Do not have Orbit yet? Install it, then open this link again or enter the code in the app.</p>
    <p id="invalid" hidden>This link is not an invitation. Ask for a new one.</p>
    <noscript><p>Open Orbit and enter the invitation code from the message you were sent.</p></noscript>
  </main>
  <script>
    // The page of an invitation link (#295): https://<host>/join/<code>. It shows the code and opens the same
    // invitation in the app through the orbit:// link the app registers (ADR 0002). The code has the shape the
    // rules and the app require: eight characters of this alphabet.
    (function () {
      var ALPHABET = /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{8}$/;
      var TEXT = {
        en: {
          title: "You are invited to Orbit",
          intro: "Open the invitation in the app, or enter this code under \"Got an invite?\".",
          open: "Open in Orbit",
          copy: "Copy the code",
          copied: "Copied",
          get: "Do not have Orbit yet? Install it, then open this link again or enter the code in the app.",
          invalid: "This link is not an invitation. Ask for a new one."
        },
        es: {
          title: "Te han invitado a Orbit",
          intro: "Abre la invitación en la app, o escribe este código en \"¿Tienes una invitación?\".",
          open: "Abrir en Orbit",
          copy: "Copiar el código",
          copied: "Copiado",
          get: "¿Aún no tienes Orbit? Instálala y vuelve a abrir este enlace, o escribe el código en la app.",
          invalid: "Este enlace no es una invitación. Pide uno nuevo."
        },
        ca: {
          title: "T'han convidat a Orbit",
          intro: "Obre la invitació a l'app, o escriu aquest codi a \"Tens una invitació?\".",
          open: "Obre a Orbit",
          copy: "Copia el codi",
          copied: "Copiat",
          get: "Encara no tens Orbit? Instal·la-la i torna a obrir aquest enllaç, o escriu el codi a l'app.",
          invalid: "Aquest enllaç no és una invitació. Demana'n un de nou."
        },
        it: {
          title: "Sei stato invitato su Orbit",
          intro: "Apri l'invito nell'app, oppure inserisci questo codice in \"Hai un invito?\".",
          open: "Apri in Orbit",
          copy: "Copia il codice",
          copied: "Copiato",
          get: "Non hai ancora Orbit? Installala e riapri questo link, oppure inserisci il codice nell'app.",
          invalid: "Questo link non è un invito. Chiedine uno nuovo."
        }
      };

      var language = (navigator.language || "en").slice(0, 2);
      var text = TEXT[language] || TEXT.en;
      document.documentElement.lang = TEXT[language] ? language : "en";
      document.title = text.title;

      function show(id, value) {
        var element = document.getElementById(id);
        if (value !== undefined) element.textContent = value;
        element.hidden = false;
        return element;
      }

      show("title", text.title);
      var match = /^\/join\/([^\/?#]+)\/?$/.exec(location.pathname);
      var code = match ? decodeURIComponent(match[1]).toUpperCase() : "";
      if (!ALPHABET.test(code)) {
        show("invalid", text.invalid);
        return;
      }

      show("invitation");
      document.getElementById("intro").textContent = text.intro;
      show("code", code);
      var open = show("open", text.open);
      open.href = "orbit://join/" + code;
      var copy = show("copy", text.copy);
      copy.addEventListener("click", function () {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(code).then(function () { copy.textContent = text.copied; });
        }
      });
      show("get", text.get);
    })();
  </script>
</body>
</html>
